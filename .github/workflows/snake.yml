name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. Este es el paso clave que faltaba para clonar el repositorio
      - name: Clone Repository
        uses: actions/checkout@v4 

      # 2. Generador del juego de la serpiente
      - name: Generate Snake Animation
        uses: Platane/snk@v3
        with:
          github_user_name: MateoDev7j
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9&color_background=#aaaaaa

      # 3. Guardar los resultados en la rama output
      - name: Push to GitHub Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
